{% extends 'base.html' %}

{% block title %}Create Account - FrameCraft Studio{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 30px auto; background: #fff; box-shadow: var(--fk-shadow); border-radius: 4px; overflow: hidden; display: grid; grid-template-columns: 320px 1fr; min-height: 500px;">
  
  <!-- Left Blue Column -->
  <div style="background: var(--fk-blue); color: #fff; padding: 40px 32px; display: flex; flex-direction: column; justify-content: space-between;">
    <div>
      <h2 style="font-size: 28px; font-weight: 700; margin-bottom: 16px;">Create Account</h2>
      <p style="font-size: 15px; color: #e0e8ff; line-height: 1.5;">Sign up with your email to start creating custom photo frames with high-definition prints.</p>
    </div>
    <div style="text-align: center; margin-top: 30px;">
      <i class="fa-solid fa-wand-magic-sparkles" style="font-size: 80px; color: rgba(255,255,255,0.25);"></i>
    </div>
  </div>

  <!-- Right Form Column -->
  <div style="padding: 40px 32px; display: flex; flex-direction: column; justify-content: space-between;">
    <form action="{{ url_for('register') }}" method="POST">
      <input type="hidden" name="next" value="{{ next }}">

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 12px; color: #878787; font-weight: 600; text-transform: uppercase; margin-bottom: 6px;">Full Name *</label>
        <input 
          type="text" 
          name="name" 
          required 
          placeholder="Enter Full Name" 
          style="width: 100%; border: none; border-bottom: 1px solid #e0e0e0; padding: 8px 0; font-size: 14px; outline: none;"
        >
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 12px; color: #878787; font-weight: 600; text-transform: uppercase; margin-bottom: 6px;">Email Address *</label>
        <input 
          type="email" 
          name="email" 
          required 
          placeholder="Enter Email Address" 
          style="width: 100%; border: none; border-bottom: 1px solid #e0e0e0; padding: 8px 0; font-size: 14px; outline: none;"
        >
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 12px; color: #878787; font-weight: 600; text-transform: uppercase; margin-bottom: 6px;">Phone Number (Optional)</label>
        <input 
          type="tel" 
          name="phone" 
          placeholder="Enter 10 digit mobile number" 
          style="width: 100%; border: none; border-bottom: 1px solid #e0e0e0; padding: 8px 0; font-size: 14px; outline: none;"
        >
      </div>

      <div style="margin-bottom: 24px;">
        <label style="display: block; font-size: 12px; color: #878787; font-weight: 600; text-transform: uppercase; margin-bottom: 6px;">Set Password *</label>
        <input 
          type="password" 
          name="password" 
          required 
          placeholder="Create a password" 
          style="width: 100%; border: none; border-bottom: 1px solid #e0e0e0; padding: 8px 0; font-size: 14px; outline: none;"
        >
      </div>

      <button type="submit" style="width: 100%; background: var(--fk-orange); color: #fff; font-size: 15px; font-weight: 700; padding: 12px; border-radius: 2px; border: none; cursor: pointer; text-transform: uppercase; box-shadow: 0 1px 2px rgba(0,0,0,0.2);">
        CREATE ACCOUNT & CONTINUE
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="{{ url_for('login', next=next) }}" style="color: var(--fk-blue); font-size: 14px; font-weight: 700;">
        Existing User? Log in
      </a>
    </div>
  </div>

</div>
{% endblock %}
